# Hanzo CI/CD for zooai/computer: .github/workflows/cicd.yml imports hanzoai/ci,
# which reads this file. The build door builds each image, one BuildKit Job
# per platform.
images:
  - name: computer
    context: .
    dockerfile: Dockerfile
    repo: ghcr.io/zooai/computer
    platforms: [linux/amd64]
