    <clipPath id="zf-disc"><circle cx="512" cy="511" r="500"/></clipPath>
    <clipPath id="zf-top"><circle cx="512" cy="250" r="430"/></clipPath>
    <clipPath id="zf-ll"><circle cx="240" cy="670" r="430"/></clipPath>
